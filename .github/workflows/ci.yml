name: CI

# 每次 push / PR 都验证：护栏还能拦住历史 bug、三种格式还能渲染出来。
# 渲染产物作为 artifact 上传，可直接下载查看。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  TYPST_VERSION: "0.15.1"

jobs:
  build-and-test:
    name: 渲染 + 回归测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ── 依赖 ──────────────────────────────────────────────────
      - name: 安装 Typst ${{ env.TYPST_VERSION }}
        run: |
          set -euo pipefail
          URL="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}"
          curl -fsSL -o typst.tar.xz \
            "${URL}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf typst.tar.xz
          sudo install -m 755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: 安装中文字体（渲染 CJK 必需）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk libzbar0
          fc-list :lang=zh family | sort -u | head -5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: pip install --quiet pillow pyzbar

      # ── 验证 ──────────────────────────────────────────────────
      # 图片资产完整性：防止「二进制 → 文本 → 二进制」往返把高位字节
      # 替换成 U+FFFD，导致 PNG/JPEG 文件头即损坏、渲染直接失败。
      # 必须在渲染之前查，否则报错信息是 typst 的 Invalid PNG signature，
      # 很难联想到是资产文件被文本化过。
      - name: 图片资产完整性检查
        run: python3 scripts/check_images.py

      # ── 4.4.0：AI 生图/改图脚本冒烟（不需要 API key，只验证 import + CLI 能起）──
      # 这些是新增能力；不进 CI 的话，改坏了要等用户真调模型才发现。
      - name: AI 生图/改图脚本冒烟
        run: |
          python3 -m py_compile scripts/image_api.py scripts/generate_illustration.py scripts/edit_image.py scripts/suggest_size.py
          python3 scripts/generate_illustration.py --help > /dev/null
          python3 scripts/edit_image.py --help > /dev/null
          python3 scripts/suggest_size.py --list-scenarios > /dev/null
          python3 scripts/suggest_size.py --scenario 微信邀请函 > /dev/null
          # 改字指令必须被拦截（返回码 2）；其它非 0 是脚本坏了，不是拦截成功
          set +e
          python3 scripts/edit_image.py --in example/qr-demo.png --out /tmp/x.png --prompt "把日期改成11月8日" >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2 || { echo "❌ 改字指令未被正确拦截（rc=$rc）"; exit 1; }
          # 画面指令不得被误拒（--check-text 只做检查、不调模型，rc 应为 0）
          python3 scripts/edit_image.py --check-text --in example/qr-demo.png --prompt "把背景调暖" >/dev/null 2>&1 \
            || { echo "❌ 画面指令被误拒"; exit 1; }
          echo "✅ 生图脚本冒烟通过（改字拦截 + 画面放行）"

      # 护栏类测试：断言会不会响、正确配置会不会误报、溢出能不能抓到。
      # 不需要先渲染，用例自带 Typst 夹具。
      - name: 回归测试（断言 + 溢出像素检查）
        working-directory: example
        run: python3 tests/run_tests.py

      # 完整渲染，含预检两道闸（数据 → 成品）
      - name: 渲染全部格式（含预检双闸）
        working-directory: example
        run: ./build.sh

      # 二维码在屏幕上看不出问题，打印出来才扫不出 —— 必须单独验
      - name: 二维码可扫性检查
        working-directory: example
        run: python3 tests/check_qr.py

      # ── 产物 ──────────────────────────────────────────────────
      - name: 上传渲染产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: posters-${{ github.sha }}
          path: |
            example/out/*.png
            example/out/*.pdf
            example/out/*_preview.jpg
          retention-days: 30
          if-no-files-found: warn
